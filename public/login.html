<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FreelanceHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#007BFF',
                        dark: '#0D1B2A',
                        'primary-hover': '#0056b3'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 via-blue-200 to-blue-300 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
        <!-- Logo -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-primary">Obra</h1>
            <p class="text-gray-600 mt-2">Welcome back to your workspace</p>
        </div>

        <!-- Login Form -->
        <div class="glass-effect rounded-lg shadow-lg p-8 fade-in">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Sign In</h2>
            
            <form class="space-y-4">
                <div>
                    <label for="loginEmail" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="loginEmail" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white/70 backdrop-blur-sm" placeholder="Enter your email">
                </div>
                <div>
                    <label for="loginPassword" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" id="loginPassword" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent bg-white/70 backdrop-blur-sm" placeholder="Enter your password">
                </div>
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input type="checkbox" class="rounded border-gray-300 text-primary focus:ring-primary">
                        <span class="ml-2 text-sm text-gray-600">Remember me</span>
                    </label>
                    <a href="#" class="text-sm text-primary hover:text-primary-hover">Forgot password?</a>
                </div>
                <button type="submit" class="w-full bg-primary text-white py-2 px-4 rounded-md hover:bg-primary-hover transition-colors font-medium">
                    Sign In
                </button>
                
                <div class="text-center mt-4">
                    <p class="text-sm text-gray-600">Continue as:</p>
                    <div class="flex gap-2 mt-2">
                        <a href="../public/worker/worker-dashboard.html" class="flex-1 bg-blue-50/70 text-primary py-2 px-4 rounded-md hover:bg-blue-100/70 transition-colors text-sm font-medium backdrop-blur-sm">
                            Freelancer
                        </a>
                        <a href="../public/client/client-dashboard.html" class="flex-1 bg-green-50/70 text-green-600 py-2 px-4 rounded-md hover:bg-green-100/70 transition-colors text-sm font-medium backdrop-blur-sm">
                            Client
                        </a>
                    </div>
                </div>
            </form>

            <!-- Sign Up Link -->
            <div class="text-center mt-6 pt-6 border-t border-gray-200">
                <p class="text-sm text-gray-600">
                    Don't have an account? 
                    <a href="signup.html" class="text-primary hover:text-primary-hover font-medium transition-colors">
                        Sign up here
                    </a>
                </p>
            </div>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-6">
            <a href="index.html" class="text-gray-600 hover:text-gray-800 text-sm">← Back to Home</a>
        </div>
    </div>
</body>
</html>
