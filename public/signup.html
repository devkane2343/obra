<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Obra PH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#007BFF',
                        dark: '#0D1B2A',
                        'primary-hover': '#0056b3'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
        body, html {
            font-family: 'Lucida Sans', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans Regular', Geneva, Verdana, sans-serif;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Lucida Sans', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans Regular', Geneva, Verdana, 'Georgia', serif;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .slide-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 via-blue-200 to-blue-300 min-h-screen">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <!-- Header -->
            <div class="text-center">
                <h1 class="text-3xl font-bold text-primary mb-2">Obra PH</h1>
                <p class="text-gray-600">Create your account to get started</p>
            </div>
         
   
                  <!-- OAuth Login Buttons -->
               <div class="glass-effect rounded-lg shadow-lg p-6 mb-4 flex flex-col gap-3 fade-in">
                <button id="googleSignInBtn" type="button" class="w-full flex items-center justify-center gap-2 bg-white border border-gray-300 rounded-md py-2 px-4 font-medium text-gray-700 hover:bg-gray-50 transition-colors shadow-sm">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="h-5 w-5"> Continue with Google
                </button>
                <button id="facebookSignInBtn" type="button" class="w-full flex items-center justify-center gap-2 bg-blue-600 border border-blue-700 rounded-md py-2 px-4 font-medium text-white hover:bg-blue-700 transition-colors shadow-sm">
                    <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook" class="h-5 w-5 bg-white rounded-full"> Continue with Facebook
                </button>
            </div>
            <!-- End OAuth Login Buttons -->


                <!-- Sign In Link -->
                <div class="text-center mt-6 pt-6 border-t border-gray-200">
                    <p class="text-sm text-gray-600">
                        Already have an account? 
                        <a href="login.html" class="text-primary hover:text-primary-hover font-medium transition-colors">
                            Sign in here
                        </a>
                        <div class="text-center mt-6">
                            <a href="index.html" class="text-gray-600 hover:text-gray-800 text-sm">← Back to Home</a>
                        </div>
                    </p>
                </div>
            </div>
             
            <!-- Back to Home -->
            
        </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script async defer crossorigin="anonymous" src="https://connect.facebook.net/en_US/sdk.js"></script>
    <script>
        let currentUserType = 'client';
        let oauthInProgress = false;
        let oauthWelcomeTimeout;

        // --- Google OAuth ---
        function handleGoogleCredentialResponse(response) {
            // Decode JWT to get user info
            try {
                const payload = JSON.parse(atob(response.credential.split('.')[1]));
                // const name = payload.name;
                // const email = payload.email;
                // const picture = payload.picture;
                // showWelcomeMessage({ name, email, picture, provider: 'Google' });
                window.location.href = 'signup2.html';
            } catch (e) {
                showError('Google login failed. Please try again.');
            }
        }

        function renderGoogleButton() {
            const googleBtn = document.getElementById('googleSignInBtn');
            googleBtn.addEventListener('click', function() {
                if (oauthInProgress) return;
                oauthInProgress = true;
                google.accounts.id.prompt((notification) => {
                    if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                        oauthInProgress = false;
                        showError('Google login was cancelled or could not be displayed.');
                    }
                });
            });
            // Initialize Google Identity Services
            window.onload = function() {
                google.accounts.id.initialize({
                    client_id: '94071956664-fg7al838nsc8dn2ikf6krtrfb5jc1t94.apps.googleusercontent.com', // TODO: Replace with your Google client ID
                    callback: handleGoogleCredentialResponse,
                    ux_mode: 'popup',
                });
            };
        }

        // --- Facebook OAuth ---
        function initFacebookSDK() {
            window.fbAsyncInit = function() {
                FB.init({
                    appId      : 'YOUR_FACEBOOK_APP_ID', // TODO: Replace with your Facebook App ID
                    cookie     : true,
                    xfbml      : false,
                    version    : 'v19.0'
                });
            };
        }
        function handleFacebookLogin() {
            if (oauthInProgress) return;
            oauthInProgress = true;
            FB.login(function(response) {
                if (response.authResponse) {
                    FB.api('/me', {fields: 'name,email,picture'}, function(profile) {
                        if (profile && profile.email) {
                            showWelcomeMessage({
                                name: profile.name,
                                email: profile.email,
                                picture: profile.picture?.data?.url,
                                provider: 'Facebook'
                            });
                        } else {
                            showError('Could not retrieve Facebook profile info.');
                        }
                    });
                } else {
                    showError('Facebook login was cancelled or failed.');
                }
            }, {scope: 'public_profile,email'});
        }
        function renderFacebookButton() {
            const fbBtn = document.getElementById('facebookSignInBtn');
            fbBtn.addEventListener('click', handleFacebookLogin);
        }

        // --- Welcome Message & Error Handling ---
        function showWelcomeMessage({ name, email, picture, provider }) {
            oauthInProgress = false;
            clearTimeout(oauthWelcomeTimeout);
            const container = document.querySelector('.max-w-md');
            container.innerHTML = `
                <div class="glass-effect rounded-lg shadow-lg p-8 fade-in flex flex-col items-center text-center">
                    <img src="${picture || ''}" alt="Profile Picture" class="w-20 h-20 rounded-full mb-4 border-4 border-primary shadow">
                    <h2 class="text-2xl font-bold text-gray-800 mb-2">Welcome, ${name}!</h2>
                    <p class="text-gray-600 mb-2">Signed in with <span class="font-semibold">${provider}</span></p>
                    <p class="text-gray-500 text-sm mb-4">${email}</p>
                    <a href="index.html" class="mt-4 inline-block bg-primary text-white px-6 py-2 rounded-md hover:bg-primary-hover transition-colors font-medium">Go to Home</a>
                </div>
            `;
            oauthWelcomeTimeout = setTimeout(() => {
                window.location.href = 'index.html';
            }, 5000);
        }
        function showError(message) {
            oauthInProgress = false;
            clearTimeout(oauthWelcomeTimeout);
            const container = document.querySelector('.max-w-md');
            const prev = container.innerHTML;
            container.innerHTML = `
                <div class="glass-effect rounded-lg shadow-lg p-8 fade-in flex flex-col items-center text-center">
                    <h2 class="text-xl font-bold text-red-600 mb-2">Error</h2>
                    <p class="text-gray-700 mb-4">${message}</p>
                    <button class="bg-primary text-white px-6 py-2 rounded-md hover:bg-primary-hover transition-colors font-medium" id="retryBtn">Back to Signup</button>
                </div>
            `;
            document.getElementById('retryBtn').onclick = () => {
                container.innerHTML = prev;
                renderGoogleButton();
                renderFacebookButton();
            };
        }

        // --- Existing JS for form and UI ---
        function switchUserType(type) {
            currentUserType = type;
            const clientToggle = document.getElementById('clientToggle');
            const workerToggle = document.getElementById('workerToggle');
            const clientField = document.getElementById('clientField');
            const workerField = document.getElementById('workerField');
            const workCategory = document.getElementById('workCategory');
            const specialization = document.getElementById('specialization');
            if (type === 'client') {
                clientToggle.className = 'flex-1 py-2 px-4 text-sm font-medium rounded-md transition-all duration-200 bg-primary text-white shadow-sm';
                workerToggle.className = 'flex-1 py-2 px-4 text-sm font-medium rounded-md transition-all duration-200 text-gray-500 hover:text-gray-700';
                clientField.classList.remove('hidden');
                workerField.classList.add('hidden');
                workCategory.required = true;
                specialization.required = false;
                setTimeout(() => { clientField.classList.add('fade-in'); }, 50);
            } else {
                workerToggle.className = 'flex-1 py-2 px-4 text-sm font-medium rounded-md transition-all duration-200 bg-primary text-white shadow-sm';
                clientToggle.className = 'flex-1 py-2 px-4 text-sm font-medium rounded-md transition-all duration-200 text-gray-500 hover:text-gray-700';
                workerField.classList.remove('hidden');
                clientField.classList.add('hidden');
                specialization.required = true;
                workCategory.required = false;
                setTimeout(() => { workerField.classList.add('fade-in'); }, 50);
            }
        }
        function handleSubmit(event) {
            event.preventDefault();
            const submitText = document.getElementById('submitText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const submitButton = event.target.querySelector('button[type="submit"]');
            submitText.textContent = 'Creating Account...';
            loadingSpinner.classList.remove('hidden');
            submitButton.disabled = true;
            const formData = new FormData(event.target);
            const data = {
                userType: currentUserType,
                fullName: formData.get('fullName'),
                email: formData.get('email'),
                password: formData.get('password'),
                terms: formData.get('terms') === 'on'
            };
            if (currentUserType === 'client') {
                data.workCategory = formData.get('workCategory');
            } else {
                data.specialization = formData.get('specialization');
            }

            fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(response => {
                if (response.success) {
                    submitText.textContent = 'Account Created!';
                    loadingSpinner.classList.add('hidden');
                    setTimeout(() => {
                        submitText.textContent = 'Create Account';
                        submitButton.disabled = false;
                        event.target.reset();
                        // Optionally redirect or show a message
                    }, 2000);
                } else {
                    throw new Error(response.message || 'Signup failed');
                }
            })
            .catch(err => {
                submitText.textContent = 'Create Account';
                loadingSpinner.classList.add('hidden');
                submitButton.disabled = false;
                alert('Error: ' + err.message);
            });
        }
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input, select');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.classList.add('transform', 'scale-[1.02]');
                });
                input.addEventListener('blur', function() {
                    this.parentElement.classList.remove('transform', 'scale-[1.02]');
                });
            });
            renderGoogleButton();
            renderFacebookButton();
            initFacebookSDK();
        });
    </script>
</body>
</html>
