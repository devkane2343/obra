<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Obra PH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#007BFF',
                        dark: '#0D1B2A',
                        'primary-hover': '#0056b3'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
        body, html {
            font-family: 'Lucida Sans', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans Regular', Geneva, Verdana, sans-serif;
        }
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Lucida Sans', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans Regular', Geneva, Verdana, 'Georgia', serif;
        }
        .glass-effect {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .slide-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 via-blue-200 to-blue-300 min-h-screen">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <!-- Header -->
            <div class="text-center">
                <h1 class="text-3xl font-bold text-primary mb-2">Obra PH</h1>
                <p class="text-gray-600">Create your account to get started</p>
            </div>
         
   
                  <!-- OAuth Login Buttons -->
               <div class="glass-effect rounded-lg shadow-lg p-6 mb-4 flex flex-col gap-3 fade-in">
                <button id="googleSignInBtn" type="button" class="w-full flex items-center justify-center gap-2 bg-white border border-gray-300 rounded-md py-2 px-4 font-medium text-gray-700 hover:bg-gray-50 transition-colors shadow-sm">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" class="h-5 w-5"> Continue with Google
                </button>
                <button id="facebookSignInBtn" type="button" class="w-full flex items-center justify-center gap-2 bg-blue-600 border border-blue-700 rounded-md py-2 px-4 font-medium text-white hover:bg-blue-700 transition-colors shadow-sm">
                    <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" alt="Facebook" class="h-5 w-5 bg-white rounded-full"> Continue with Facebook
                </button>
            </div>
            <!-- End OAuth Login Buttons -->


                <!-- Sign In Link -->
                <div class="text-center mt-6 pt-6 border-t border-gray-200">
                    <p class="text-sm text-gray-600">
                        Already have an account? 
                        <a href="login.html" class="text-primary hover:text-primary-hover font-medium transition-colors">
                            Sign in here
                        </a>
                        <div class="text-center mt-6">
                            <a href="index.html" class="text-gray-600 hover:text-gray-800 text-sm">← Back to Home</a>
                        </div>
                    </p>
                </div>
            </div>
             
            <!-- Back to Home -->
            
        </div>
    </div>

    <!-- Add Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script>
        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyDdU55TPZVf-Ok-jgusZq_BBuVF1DDwP_k",
  authDomain: "obra-dbe16.firebaseapp.com",
  projectId: "obra-dbe16",
  storageBucket: "obra-dbe16.firebasestorage.app",
  messagingSenderId: "273637438399",
  appId: "1:273637438399:web:f7e68f1bc1f6f474f7a70a",
  measurementId: "G-TZWQYWPJ7H"
            // ...other config as needed
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // --- Google Sign-In ---
        document.getElementById('googleSignInBtn').addEventListener('click', async function() {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                const session = {
                    uid: user.uid,
                    name: user.displayName,
                    email: user.email,
                    provider: result.providerId || (user.providerData[0]?.providerId) || 'google.com'
                };
                localStorage.setItem('obraUser', JSON.stringify(session));
                window.location.href = 'choose-role.html';
            } catch (error) {
                showAuthError(error);
            }
        });

        // --- Facebook Sign-In ---
        document.getElementById('facebookSignInBtn').addEventListener('click', async function() {
            const provider = new firebase.auth.FacebookAuthProvider();
            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                const session = {
                    uid: user.uid,
                    name: user.displayName,
                    email: user.email,
                    provider: result.providerId || (user.providerData[0]?.providerId) || 'facebook.com'
                };
                localStorage.setItem('obraUser', JSON.stringify(session));
                window.location.href = 'choose-role.html';
            } catch (error) {
                showAuthError(error);
            }
        });

        // --- Error Handling ---
        function showAuthError(error) {
            let message = error.message || 'Authentication failed. Please try again.';
            if (error.code === 'auth/popup-blocked') {
                message = 'Popup was blocked. Please allow popups and try again.';
            } else if (error.code === 'auth/account-exists-with-different-credential') {
                message = 'An account already exists with the same email but different sign-in method.';
            }
            showToast(message, true);
        }
        // --- Toast UI ---
        function showToast(msg, isError = false) {
            let toast = document.getElementById('obra-toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'obra-toast';
                toast.className = 'fixed top-6 left-1/2 transform -translate-x-1/2 z-50 px-4 py-2 rounded shadow-lg text-white text-center fade-in';
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.style.background = isError ? '#dc2626' : '#16a34a';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 3500);
        }
        // --- Existing JS for form and UI ---
        function switchUserType(type) {
            currentUserType = type;
            const clientToggle = document.getElementById('clientToggle');
            const workerToggle = document.getElementById('workerToggle');
            const clientField = document.getElementById('clientField');
            const workerField = document.getElementById('workerField');
            const workCategory = document.getElementById('workCategory');
            const specialization = document.getElementById('specialization');
            if (type === 'client') {
                clientToggle.className = 'flex-1 py-2 px-4 text-sm font-medium rounded-md transition-all duration-200 bg-primary text-white shadow-sm';
                workerToggle.className = 'flex-1 py-2 px-4 text-sm font-medium rounded-md transition-all duration-200 text-gray-500 hover:text-gray-700';
                clientField.classList.remove('hidden');
                workerField.classList.add('hidden');
                workCategory.required = true;
                specialization.required = false;
                setTimeout(() => { clientField.classList.add('fade-in'); }, 50);
            } else {
                workerToggle.className = 'flex-1 py-2 px-4 text-sm font-medium rounded-md transition-all duration-200 bg-primary text-white shadow-sm';
                clientToggle.className = 'flex-1 py-2 px-4 text-sm font-medium rounded-md transition-all duration-200 text-gray-500 hover:text-gray-700';
                workerField.classList.remove('hidden');
                clientField.classList.add('hidden');
                specialization.required = true;
                workCategory.required = false;
                setTimeout(() => { workerField.classList.add('fade-in'); }, 50);
            }
        }
        function handleSubmit(event) {
            event.preventDefault();
            const submitText = document.getElementById('submitText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const submitButton = event.target.querySelector('button[type="submit"]');
            submitText.textContent = 'Creating Account...';
            loadingSpinner.classList.remove('hidden');
            submitButton.disabled = true;
            const formData = new FormData(event.target);
            const data = {
                userType: currentUserType,
                fullName: formData.get('fullName'),
                email: formData.get('email'),
                password: formData.get('password'),
                terms: formData.get('terms') === 'on'
            };
            if (currentUserType === 'client') {
                data.workCategory = formData.get('workCategory');
            } else {
                data.specialization = formData.get('specialization');
            }

            fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(response => {
                if (response.success) {
                    submitText.textContent = 'Account Created!';
                    loadingSpinner.classList.add('hidden');
                    setTimeout(() => {
                        submitText.textContent = 'Create Account';
                        submitButton.disabled = false;
                        event.target.reset();
                        // Optionally redirect or show a message
                    }, 2000);
                } else {
                    throw new Error(response.message || 'Signup failed');
                }
            })
            .catch(err => {
                submitText.textContent = 'Create Account';
                loadingSpinner.classList.add('hidden');
                submitButton.disabled = false;
                alert('Error: ' + err.message);
            });
        }
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input, select');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.classList.add('transform', 'scale-[1.02]');
                });
                input.addEventListener('blur', function() {
                    this.parentElement.classList.remove('transform', 'scale-[1.02]');
                });
            });
            // renderGoogleButton(); // Removed as per new_code
            // renderFacebookButton(); // Removed as per new_code
            // initFacebookSDK(); // Removed as per new_code
        });
    </script>
</body>
</html>
