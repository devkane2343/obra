<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Profile - Update Your Information</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Navigation -->
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <div class="flex-shrink-0">
                        <h1 class="text-xl font-bold text-primary-700">Work Profile</h1>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <span class="text-gray-700">Welcome, John</span>
                    <button class="text-gray-500 hover:text-gray-700 transition-colors">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                        </svg>
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-4xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <div class="bg-white rounded-lg shadow-sm border border-gray-200">
            <!-- Header -->
            <div class="px-6 py-4 border-b border-gray-200">
                <h2 class="text-2xl font-bold text-gray-900">Update Profile</h2>
                <p class="text-gray-600 mt-1">Keep your professional information up to date</p>
            </div>

            <!-- Form -->
            <form id="profileForm" class="p-6 space-y-8">
                <!-- Profile Picture Section -->
                <div class="flex flex-col sm:flex-row items-start sm:items-center space-y-4 sm:space-y-0 sm:space-x-6">
                    <div class="relative">
                        <div id="profileImageContainer" class="w-24 h-24 rounded-full bg-gray-200 flex items-center justify-center overflow-hidden">
                            <svg class="w-12 h-12 text-gray-400" fill="currentColor" viewBox="0 0 24 24">
                                <path d="M24 20.993V24H0v-2.996A14.977 14.977 0 0112.004 15c4.904 0 9.26 2.354 11.996 5.993zM16.002 8.999a4 4 0 11-8 0 4 4 0 018 0z"/>
                            </svg>
                            <img id="profilePreview" class="w-full h-full object-cover hidden" alt="Profile preview">
                        </div>
                        <label for="profilePicture" class="absolute bottom-0 right-0 bg-primary-600 text-white rounded-full p-1 cursor-pointer hover:bg-primary-700 transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path>
                            </svg>
                        </label>
                        <input type="file" id="profilePicture" name="profilePicture" accept="image/*" class="hidden">
                    </div>
                    <div>
                        <h3 class="text-lg font-medium text-gray-900">Profile Picture</h3>
                        <p class="text-sm text-gray-500">Upload a professional photo (JPG, PNG, max 5MB)</p>
                    </div>
                </div>

                <!-- Personal Information -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="fullName" class="block text-sm font-medium text-gray-700 mb-2">
                            Full Name <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="fullName" name="fullName" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                               placeholder="Enter your full name">
                        <div class="error-message hidden text-red-500 text-sm mt-1"></div>
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                            Email Address <span class="text-red-500">*</span>
                        </label>
                        <input type="email" id="email" name="email" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                               placeholder="your.email@example.com">
                        <div class="error-message hidden text-red-500 text-sm mt-1"></div>
                    </div>

                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
                            Phone Number <span class="text-red-500">*</span>
                        </label>
                        <input type="tel" id="phone" name="phone" required
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                               placeholder="(555) 123-4567">
                        <div class="error-message hidden text-red-500 text-sm mt-1"></div>
                    </div>
                </div>

                <!-- Work Experience -->
                <div>
                    <label for="workExperience" class="block text-sm font-medium text-gray-700 mb-2">
                        Work Experience <span class="text-red-500">*</span>
                    </label>
                    <textarea id="workExperience" name="workExperience" rows="4" required
                              class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors resize-none"
                              placeholder="Describe your relevant work experience, including job titles, companies, and key responsibilities..."></textarea>
                    <div class="error-message hidden text-red-500 text-sm mt-1"></div>
                </div>

                <!-- Skills/Specializations -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Skills & Specializations
                    </label>
                    <div class="space-y-3">
                        <div class="flex flex-wrap gap-2" id="skillsContainer">
                            <!-- Skills will be added here dynamically -->
                        </div>
                        <div class="flex gap-2">
                            <input type="text" id="skillInput" 
                                   class="flex-1 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                                   placeholder="Add a skill (e.g., Electrical, Plumbing, HVAC)">
                            <button type="button" id="addSkillBtn" 
                                    class="px-4 py-2 bg-primary-600 text-white rounded-md hover:bg-primary-700 transition-colors">
                                Add
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Licenses -->
                <div>
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Licenses</h3>
                    <div id="licensesContainer" class="space-y-4">
                        <div class="license-entry border border-gray-200 rounded-lg p-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">License Description</label>
                                    <input type="text" name="licenseDescription[]" 
                                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                                           placeholder="e.g., Electrical License Class A">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">License File</label>
                                    <input type="file" name="licenseFile[]" accept=".pdf,.jpg,.jpeg,.png"
                                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors file:mr-4 file:py-1 file:px-2 file:rounded file:border-0 file:text-sm file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100">
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="button" id="addLicenseBtn" 
                            class="mt-3 px-4 py-2 border border-primary-600 text-primary-600 rounded-md hover:bg-primary-50 transition-colors">
                        + Add Another License
                    </button>
                </div>

                <!-- Training Certificates -->
                <div>
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Training Certificates</h3>
                    <div id="certificatesContainer" class="space-y-4">
                        <div class="certificate-entry border border-gray-200 rounded-lg p-4">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Certificate Description</label>
                                    <input type="text" name="certificateDescription[]" 
                                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                                           placeholder="e.g., OSHA 30-Hour Construction Safety">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-2">Certificate File</label>
                                    <input type="file" name="certificateFile[]" accept=".pdf,.jpg,.jpeg,.png"
                                           class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors file:mr-4 file:py-1 file:px-2 file:rounded file:border-0 file:text-sm file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100">
                                </div>
                            </div>
                        </div>
                    </div>
                    <button type="button" id="addCertificateBtn" 
                            class="mt-3 px-4 py-2 border border-primary-600 text-primary-600 rounded-md hover:bg-primary-50 transition-colors">
                        + Add Another Certificate
                    </button>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-end pt-6 border-t border-gray-200">
                    <button type="submit" id="updateBtn"
                            class="px-8 py-3 bg-primary-600 text-white font-medium rounded-md hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 transition-all duration-200 transform hover:scale-105">
                        <span class="flex items-center">
                            <svg class="w-5 h-5 mr-2 hidden" id="loadingSpinner" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                            Update Profile
                        </span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Success Modal -->
    <div id="successModal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-sm mx-4 transform transition-all">
            <div class="flex items-center justify-center w-12 h-12 mx-auto bg-green-100 rounded-full mb-4">
                <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
            </div>
            <h3 class="text-lg font-medium text-gray-900 text-center mb-2">Profile Updated!</h3>
            <p class="text-gray-600 text-center mb-4">Your profile information has been successfully updated.</p>
            <button id="closeModal" class="w-full px-4 py-2 bg-primary-600 text-white rounded-md hover:bg-primary-700 transition-colors">
                Close
            </button>
        </div>
    </div>

    <script>
        // Profile picture handling
        document.getElementById('profilePicture').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('profilePreview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        });

        // Skills management
        const skillsContainer = document.getElementById('skillsContainer');
        const skillInput = document.getElementById('skillInput');
        const addSkillBtn = document.getElementById('addSkillBtn');
        let skills = [];

        function addSkill(skillText) {
            if (skillText && !skills.includes(skillText)) {
                skills.push(skillText);
                renderSkills();
            }
        }

        function removeSkill(skillText) {
            skills = skills.filter(skill => skill !== skillText);
            renderSkills();
        }

        function renderSkills() {
            skillsContainer.innerHTML = skills.map(skill => `
                <span class="inline-flex items-center px-3 py-1 rounded-full text-sm bg-primary-100 text-primary-800">
                    ${skill}
                    <button type="button" onclick="removeSkill('${skill}')" class="ml-2 text-primary-600 hover:text-primary-800">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </span>
            `).join('');
        }

        addSkillBtn.addEventListener('click', function() {
            const skillText = skillInput.value.trim();
            if (skillText) {
                addSkill(skillText);
                skillInput.value = '';
            }
        });

        skillInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const skillText = skillInput.value.trim();
                if (skillText) {
                    addSkill(skillText);
                    skillInput.value = '';
                }
            }
        });

        // Dynamic license entries
        document.getElementById('addLicenseBtn').addEventListener('click', function() {
            const container = document.getElementById('licensesContainer');
            const newEntry = document.createElement('div');
            newEntry.className = 'license-entry border border-gray-200 rounded-lg p-4';
            newEntry.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">License Description</label>
                        <input type="text" name="licenseDescription[]" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                               placeholder="e.g., Electrical License Class A">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">License File</label>
                        <input type="file" name="licenseFile[]" accept=".pdf,.jpg,.jpeg,.png"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors file:mr-4 file:py-1 file:px-2 file:rounded file:border-0 file:text-sm file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100">
                    </div>
                </div>
                <button type="button" class="mt-3 text-red-600 hover:text-red-800 text-sm" onclick="this.parentElement.remove()">
                    Remove License
                </button>
            `;
            container.appendChild(newEntry);
        });

        // Dynamic certificate entries
        document.getElementById('addCertificateBtn').addEventListener('click', function() {
            const container = document.getElementById('certificatesContainer');
            const newEntry = document.createElement('div');
            newEntry.className = 'certificate-entry border border-gray-200 rounded-lg p-4';
            newEntry.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Certificate Description</label>
                        <input type="text" name="certificateDescription[]" 
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors"
                               placeholder="e.g., OSHA 30-Hour Construction Safety">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Certificate File</label>
                        <input type="file" name="certificateFile[]" accept=".pdf,.jpg,.jpeg,.png"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors file:mr-4 file:py-1 file:px-2 file:rounded file:border-0 file:text-sm file:bg-primary-50 file:text-primary-700 hover:file:bg-primary-100">
                    </div>
                </div>
                <button type="button" class="mt-3 text-red-600 hover:text-red-800 text-sm" onclick="this.parentElement.remove()">
                    Remove Certificate
                </button>
            `;
            container.appendChild(newEntry);
        });

        // Form validation
        function validateForm() {
            const requiredFields = ['fullName', 'email', 'phone', 'workExperience'];
            let isValid = true;

            requiredFields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                const errorDiv = field.parentElement.querySelector('.error-message');
                
                if (!field.value.trim()) {
                    field.classList.add('border-red-500');
                    errorDiv.textContent = 'This field is required';
                    errorDiv.classList.remove('hidden');
                    isValid = false;
                } else {
                    field.classList.remove('border-red-500');
                    errorDiv.classList.add('hidden');
                }
            });

            // Email validation
            const email = document.getElementById('email');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (email.value && !emailRegex.test(email.value)) {
                const errorDiv = email.parentElement.querySelector('.error-message');
                email.classList.add('border-red-500');
                errorDiv.textContent = 'Please enter a valid email address';
                errorDiv.classList.remove('hidden');
                isValid = false;
            }

            return isValid;
        }

        // Form submission
        document.getElementById('profileForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            if (!validateForm()) {
                return;
            }

            // Show loading state
            const updateBtn = document.getElementById('updateBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            updateBtn.disabled = true;
            loadingSpinner.classList.remove('hidden');
            updateBtn.textContent = 'Updating...';

            // Simulate API call
            setTimeout(() => {
                // Reset button state
                updateBtn.disabled = false;
                loadingSpinner.classList.add('hidden');
                updateBtn.innerHTML = `
                    <span class="flex items-center">
                        <svg class="w-5 h-5 mr-2 hidden" id="loadingSpinner" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                        </svg>
                        Update Profile
                    </span>
                `;

                // Show success modal
                document.getElementById('successModal').classList.remove('hidden');
                document.getElementById('successModal').classList.add('flex');

                // Here you would normally send the data to your backend
                handleFormSubmission();
            }, 2000);
        });

        // Close modal
        document.getElementById('closeModal').addEventListener('click', function() {
            document.getElementById('successModal').classList.add('hidden');
            document.getElementById('successModal').classList.remove('flex');
        });

        // Placeholder function for handling form data
        function handleFormSubmission() {
            const formData = new FormData(document.getElementById('profileForm'));
            
            // Add skills to form data
            formData.append('skills', JSON.stringify(skills));
            
            console.log('Form data ready to be sent to backend:');
            for (let [key, value] of formData.entries()) {
                console.log(key, value);
            }
            
            // This is where you would send the data to your backend API
            // Example: 
            // fetch('/api/update-profile', {
            //     method: 'POST',
            //     body: formData
            // });
        }

        // Clear validation errors on input
        document.querySelectorAll('input, textarea').forEach(field => {
            field.addEventListener('input', function() {
                if (this.classList.contains('border-red-500')) {
                    this.classList.remove('border-red-500');
                    const errorDiv = this.parentElement.querySelector('.error-message');
                    if (errorDiv) {
                        errorDiv.classList.add('hidden');
                    }
                }
            });
        });

        // Make removeSkill function globally available
        window.removeSkill = removeSkill;
    </script>
</body>
</html>
