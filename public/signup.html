<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FreelanceHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#007BFF',
                        dark: '#0D1B2A',
                        'primary-hover': '#0056b3'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="style.css">
    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .slide-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-100 via-blue-200 to-blue-300 min-h-screen">
    <div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8">
            <!-- Header -->
            <div class="text-center">
                <h1 class="text-3xl font-bold text-primary mb-2">FreelanceHub</h1>
                <p class="text-gray-600">Create your account to get started</p>
            </div>

            <!-- User Type Toggle -->
            <div class="glass-effect p-1 rounded-lg flex">
                <button 
                    id="clientToggle" 
                    class="flex-1 py-2 px-4 text-sm font-medium rounded-md transition-all duration-200 bg-primary text-white shadow-sm"
                    onclick="switchUserType('client')"
                >
                    I'm a Client
                </button>
                <button 
                    id="workerToggle" 
                    class="flex-1 py-2 px-4 text-sm font-medium rounded-md transition-all duration-200 text-gray-500 hover:text-gray-700"
                    onclick="switchUserType('worker')"
                >
                    I'm a Worker
                </button>
            </div>

            <!-- Form -->
            <div class="glass-effect rounded-lg shadow-lg p-8 fade-in">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Sign Up</h2>
                <form id="signupForm" class="space-y-4" onsubmit="handleSubmit(event)">
                    <!-- Full Name -->
                    <div>
                        <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">
                            Full Name
                        </label>
                        <input 
                            id="fullName" 
                            name="fullName" 
                            type="text" 
                            required 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 bg-white/70 backdrop-blur-sm"
                            placeholder="Enter your full name"
                        >
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                            Email Address
                        </label>
                        <input 
                            id="email" 
                            name="email" 
                            type="email" 
                            required 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 bg-white/70 backdrop-blur-sm"
                            placeholder="Enter your email"
                        >
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                            Password
                        </label>
                        <input 
                            id="password" 
                            name="password" 
                            type="password" 
                            required 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 bg-white/70 backdrop-blur-sm"
                            placeholder="Create a password"
                        >
                    </div>

                    <!-- Client-specific field -->
                    <div id="clientField" class="slide-transition">
                        <label for="workCategory" class="block text-sm font-medium text-gray-700 mb-1">
                            What type of work do you usually hire for?
                        </label>
                        <select 
                            id="workCategory" 
                            name="workCategory" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 bg-white/70 backdrop-blur-sm"
                        >
                            <option value="">Select a category</option>
                            <option value="plumbing">Plumbing</option>
                            <option value="house-cleaning">House Cleaning</option>
                            <option value="tutoring">Tutoring</option>
                            <option value="web-design">Web Design</option>
                            <option value="gardening">Gardening</option>
                            <option value="electrical">Electrical Work</option>
                            <option value="painting">Painting</option>
                            <option value="carpentry">Carpentry</option>
                            <option value="pet-care">Pet Care</option>
                            <option value="photography">Photography</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <!-- Worker-specific field -->
                    <div id="workerField" class="slide-transition hidden">
                        <label for="specialization" class="block text-sm font-medium text-gray-700 mb-1">
                            Area of Specialization
                        </label>
                        <select 
                            id="specialization" 
                            name="specialization" 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200 bg-white/70 backdrop-blur-sm"
                        >
                            <option value="">Select your specialization</option>
                            <option value="carpentry">Carpentry</option>
                            <option value="data-entry">Data Entry</option>
                            <option value="cooking">Cooking</option>
                            <option value="graphic-design">Graphic Design</option>
                            <option value="writing">Content Writing</option>
                            <option value="translation">Translation</option>
                            <option value="virtual-assistant">Virtual Assistant</option>
                            <option value="social-media">Social Media Management</option>
                            <option value="accounting">Accounting</option>
                            <option value="fitness-training">Fitness Training</option>
                            <option value="music-lessons">Music Lessons</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <!-- Terms and Conditions -->
                    <div class="flex items-center">
                        <input 
                            id="terms" 
                            name="terms" 
                            type="checkbox" 
                            required
                            class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded"
                        >
                        <label for="terms" class="ml-2 block text-sm text-gray-700">
                            I agree to the 
                            <a href="terms.html" class="text-primary hover:text-primary-hover font-medium">Terms of Service</a> 
                            and 
                            <a href="policy.html" class="text-primary hover:text-primary-hover font-medium">Privacy Policy</a>
                        </label>
                    </div>

                    <!-- Submit Button -->
                    <div>
                        <button 
                            type="submit" 
                            class="w-full bg-primary text-white py-2 px-4 rounded-md hover:bg-primary-hover transition-colors font-medium transform hover:scale-[1.02]"
                        >
                            <span id="submitText">Create Account</span>
                            <svg id="loadingSpinner" class="hidden animate-spin -mr-1 ml-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </button>
                    </div>
                </form>

                <!-- Sign In Link -->
                <div class="text-center mt-6 pt-6 border-t border-gray-200">
                    <p class="text-sm text-gray-600">
                        Already have an account? 
                        <a href="login.html" class="text-primary hover:text-primary-hover font-medium transition-colors">
                            Sign in here
                        </a>
                    </p>
                </div>
            </div>

            <!-- Back to Home -->
            <div class="text-center mt-6">
                <a href="index.html" class="text-gray-600 hover:text-gray-800 text-sm">← Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        let currentUserType = 'client';

        function switchUserType(type) {
            currentUserType = type;
            
            const clientToggle = document.getElementById('clientToggle');
            const workerToggle = document.getElementById('workerToggle');
            const clientField = document.getElementById('clientField');
            const workerField = document.getElementById('workerField');
            const workCategory = document.getElementById('workCategory');
            const specialization = document.getElementById('specialization');

            if (type === 'client') {
                // Update toggle buttons
                clientToggle.className = 'flex-1 py-2 px-4 text-sm font-medium rounded-md transition-all duration-200 bg-primary text-white shadow-sm';
                workerToggle.className = 'flex-1 py-2 px-4 text-sm font-medium rounded-md transition-all duration-200 text-gray-500 hover:text-gray-700';
                
                // Show/hide fields with animation
                clientField.classList.remove('hidden');
                workerField.classList.add('hidden');
                
                // Set required attributes
                workCategory.required = true;
                specialization.required = false;
                
                // Add fade-in animation
                setTimeout(() => {
                    clientField.classList.add('fade-in');
                }, 50);
                
            } else {
                // Update toggle buttons
                workerToggle.className = 'flex-1 py-2 px-4 text-sm font-medium rounded-md transition-all duration-200 bg-primary text-white shadow-sm';
                clientToggle.className = 'flex-1 py-2 px-4 text-sm font-medium rounded-md transition-all duration-200 text-gray-500 hover:text-gray-700';
                
                // Show/hide fields with animation
                workerField.classList.remove('hidden');
                clientField.classList.add('hidden');
                
                // Set required attributes
                specialization.required = true;
                workCategory.required = false;
                
                // Add fade-in animation
                setTimeout(() => {
                    workerField.classList.add('fade-in');
                }, 50);
            }
        }

        function handleSubmit(event) {
            event.preventDefault();
            
            // Show loading state
            const submitText = document.getElementById('submitText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const submitButton = event.target.querySelector('button[type="submit"]');
            
            submitText.textContent = 'Creating Account...';
            loadingSpinner.classList.remove('hidden');
            submitButton.disabled = true;
            
            // Collect form data
            const formData = new FormData(event.target);
            const data = {
                userType: currentUserType,
                fullName: formData.get('fullName'),
                email: formData.get('email'),
                password: formData.get('password'),
                terms: formData.get('terms') === 'on'
            };
            
            // Add type-specific field
            if (currentUserType === 'client') {
                data.workCategory = formData.get('workCategory');
            } else {
                data.specialization = formData.get('specialization');
            }
            
            // Simulate API call delay
            setTimeout(() => {
                console.log('Form Data Submitted:', data);
                console.log('User Type:', currentUserType);
                console.log('Full Form Data:', Object.fromEntries(formData));
                
                // Reset loading state
                submitText.textContent = 'Account Created!';
                loadingSpinner.classList.add('hidden');
                
                // Reset form after a delay
                setTimeout(() => {
                    submitText.textContent = 'Create Account';
                    submitButton.disabled = false;
                    event.target.reset();
                }, 2000);
                
            }, 1500);
        }

        // Add smooth focus effects
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input, select');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.classList.add('transform', 'scale-[1.02]');
                });
                
                input.addEventListener('blur', function() {
                    this.parentElement.classList.remove('transform', 'scale-[1.02]');
                });
            });
        });
    </script>
</body>
</html>
